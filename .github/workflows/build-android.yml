name: Build Android APK

# Jalankan manual dari tab Actions (tombol "Run workflow"),
# atau otomatis saat ada perubahan di main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'capacitor.config.json'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build web (Vite)
        run: npm run build

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Android platform
        run: npx cap add android || true

      - name: Inject google-services.json (untuk push notif)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json asli terpasang — push notif aktif."
          else
            echo "PERINGATAN: secret GOOGLE_SERVICES_JSON belum diset — pakai placeholder (APK tetap build, push BELUM aktif)."
            node -e "require('fs').writeFileSync('android/app/google-services.json', JSON.stringify({project_info:{project_number:'000000000000',project_id:'placeholder-project',storage_bucket:'placeholder-project.appspot.com'},client:[{client_info:{mobilesdk_app_id:'1:000000000000:android:0000000000000000000000',android_client_info:{package_name:'com.renus.wadashboard'}},oauth_client:[],api_key:[{current_key:'AIzaPLACEHOLDERPLACEHOLDERPLACEHOLDER00'}],services:{appinvite_service:{other_platform_oauth_client:[]}}}],configuration_version:'1'}))"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wa-dashboard-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
